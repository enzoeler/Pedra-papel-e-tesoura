<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <title>Pedra, Papel e Tesoura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Pedra, Papel e Tesoura</h1>
  <p>Clica num botão ou usa o teclado (1, 2, 3 e R para reiniciar)</p>

  <div class="placar">
    <p>Tu: <strong id="pontos-jogador">0</strong></p>
    <p>Computador: <strong id="pontos-pc">0</strong></p>
  </div>

  <div class="botoes">
    <button id="btn-pedra">1 - Pedra</button>
    <button id="btn-papel">2 - Papel</button>
    <button id="btn-tesoura">3 - Tesoura</button>
  </div>

  <h2 id="mensagem">Escolhe uma opção para começar!</h2>

  <button id="btn-reset">Reiniciar Placar (R)</button>

  <script src="script.js"></script>
</body>
</html>
